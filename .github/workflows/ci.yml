name: CI

on:
    workflow_dispatch:
    pull_request:
        branches: [dev, master]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Format check
              run: pnpm run format:check

            - name: Lint
              run: pnpm run lint

            - name: Astro check
              run: pnpm run check

            - name: Vue typecheck
              run: pnpm run typecheck:vue

            - name: Unit tests
              run: pnpm test

            - name: Content publication checks
              run: pnpm run test:content

            - name: Static preview build
              run: pnpm run build
              env:
                  ENV: local
                  PUBLIC_SITE_URL: https://example.com

            - name: Performance budget check
              run: pnpm run verify:budget

            - name: Internal link check
              run: pnpm run verify:links

            - name: Static SEO and redirect check
              run: pnpm run verify:seo preview

            - name: Install Playwright Chromium
              run: pnpm exec playwright install --with-deps chromium

            - name: End-to-end tests
              run: pnpm run verify:e2e
              env:
                  CI: true
                  ENV: local
                  PUBLIC_SITE_URL: https://example.com

            - name: Upload verified static build
              uses: actions/upload-artifact@v4
              with:
                  name: static-dist
                  path: dist/
                  retention-days: 14
                  if-no-files-found: error

            - name: Upload Playwright artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-artifacts
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
