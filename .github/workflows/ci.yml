name: CI

on:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Format check
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Astro check
              run: npm run check

            - name: Vue typecheck
              run: npm run typecheck:vue

            - name: Unit tests
              run: npm test

            - name: Static preview build
              run: npm run build
              env:
                  ENV: local
                  PUBLIC_SITE_URL: https://example.com

            - name: Performance budget check
              run: npm run verify:budget

            - name: Internal link check
              run: npm run verify:links

            - name: Static SEO and redirect check
              run: npm run verify:seo -- preview

            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: End-to-end tests
              run: npm run verify:e2e
              env:
                  CI: true
                  ENV: local
                  PUBLIC_SITE_URL: https://example.com

            - name: Upload verified static build
              uses: actions/upload-artifact@v4
              with:
                  name: static-dist
                  path: dist/
                  retention-days: 14
                  if-no-files-found: error

            - name: Upload Playwright artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-artifacts
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
